# 公開中ツールの一覧（唯一の台帳）。関連ツール表示（_includes/tool-related.html）が参照します。
# id は index.html の data-tool-id と同じ。pref: true のツールは ?pref=都道府県 を受け取れます。
- id: dx-diagnosis
  title: 旅館・ホテル DXかんたん診断
  url: /dx-diagnosis.html
  group: facility
  tag: 無料診断
  summary: 施設の現状から、DXで優先したいポイントを整理します。
- id: kpi-calculator
  title: 宿KPI電卓
  url: /kpi-calculator.html
  group: facility
  tag: 計算ツール
  summary: 1か月の実績から、客室稼働率・ADR・RevPARと損益分岐の稼働率を計算し、都道府県の稼働率と比べます。
- id: ota-fee-simulator
  title: OTA手数料シミュレーター
  url: /ota-fee-simulator.html
  group: facility
  tag: 計算ツール
  summary: 予約経路ごとの手数料を年間でまとめ、自社サイトの割合を上げたときに手元に残る額を計算します。
- id: security-check
  title: 宿のセキュリティ10問チェック
  url: /security-check.html
  group: facility
  tag: 無料チェック
  summary: 宿で実際に起きた被害から作った10問に答えると、今週やるべきセキュリティ対策3つが分かります。
- id: ai-time-estimate
  title: 生成AI時短みつもり
  url: /ai-time-estimate.html
  group: facility
  tag: 計算ツール
  summary: 口コミ返信や外国語のお問い合わせなど、生成AIに下書きを任せて浮く時間を業務ごとに見積もります。
- id: ai-inn-bulk
  title: AIに聞かれる宿 一斉診断 集計レポート
  url: /ai-inn-diagnosis/bulk/
  group: facility
  tag: 調査レポート
  summary: 温泉地の旅館・ホテル108軒の公式サイトを、旅館ならではの12の質問で一斉に診断した集計。AIが答えられた質問は平均4.5問で、あと1行書けば答えられる質問が1軒あたり2.6問ありました。
- id: ai-inn-sample
  title: AIに聞かれる宿 診断 サンプル
  url: /ai-inn-diagnosis/sample/
  group: facility
  tag: サンプル（架空の宿）
  summary: 旅館のAIO対策を、対策前と対策後で比べたサンプル。旅館ならではの12の質問にAIが答えられた数は、4問から12問に増えました。
- id: inbound
  title: インバウンド宿泊者分析
  url: /inbound-analysis.html
  group: regional
  tag: 公的データ
  pref: true
  summary: 外国人宿泊需要や国・地域別構成を、都道府県ごとに分析します。
- id: market-signal
  title: 観光株シグナル
  url: /report.html
  group: market
  tag: 市場の動き
  summary: 観光・インバウンド関連企業の動きから、市場変化の兆候を確認します。
- id: hotel-price-trends
  title: 宿泊料金トレンド
  url: /hotel-price-trends.html
  group: market
  tag: 市場の動き
  summary: 同じ宿泊条件で、地域や施設ごとの料金と取得日ごとの推移を比較します。
- id: business-hotel-price-trends
  title: ビジネスホテル料金トレンド
  url: /business-hotel-price-trends.html
  group: market
  tag: 市場の動き
  summary: 全国10都市のビジネスホテルの料金水準と値動きを、同じ条件で毎朝観測して比べます。
- id: management-issue-organizer
  title: 宿泊経営の課題整理（β）
  url: /management-ai.html
  group: experimental
  tag: 実験的ツール（ルールベース）
  pref: true
  summary: 地域データと施設情報から、DX・人手不足・市場環境を考えるヒントを提示します。
- id: mini-pms-demo
  title: 簡易PMSデモ（予約・部屋割り）
  url: /demo/mini-pms/
  group: experimental
  tag: 体験デモ（架空データ）
  summary: 架空ホテルで、予約登録から部屋割り・客室状況表までをブラウザで体験できます。
- id: booking-engine-demo
  title: 予約エンジンデモ（公式予約サイト）
  url: /demo/booking/
  group: experimental
  tag: 体験デモ（架空データ）
  summary: 架空ホテルの公式予約サイトで、空室検索から予約・キャンセルまでを体験できます。
- id: hotel-site-demo
  title: 多言語旅館サイトデモ
  url: /demo/hotel/
  group: experimental
  tag: 体験デモ（架空データ）
  summary: 架空の宿の公式サイトを日英中韓の4言語で体験できます。旅館のAIO対策を行った後のサイトです。
